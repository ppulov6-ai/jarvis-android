name: Сборка Джарвиса Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Проверка и APK ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Подготовить Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Подготовить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить установленный Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - name: Подготовить Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Проверить Go и собрать встроенный модуль
        run: |
          gofmt -w pkg/bus pkg/agent pkg/channels pkg/config pkg/gateway pkg/tools
          make generate
          go test ./...
          make build-android-arm64
      - name: Проверить Android и собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :backend:api:testDebugUnitTest :backend:config:testDebugUnitTest :core:data:testDebugUnitTest :feature:chat:testDebugUnitTest :app:testEmbeddedDebugUnitTest :app:assembleEmbeddedDebug --stacktrace
      - name: Сохранить проверочную сборку APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-arm64-debug
          path: android/app/build/outputs/apk/embedded/debug/*.apk
          if-no-files-found: error
          retention-days: 14
