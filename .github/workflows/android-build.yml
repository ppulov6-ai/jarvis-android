name: Сборка Джарвиса Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Проверка и APK ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Подготовить Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Подготовить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить установленный Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - name: Подготовить Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Проверить Go и собрать встроенный модуль
        run: |
          gofmt -w pkg
          make generate
          go test ./...
          make build-android-arm64
      - name: Проверить Android и собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :backend:api:testDebugUnitTest :backend:config:testDebugUnitTest :core:data:testDebugUnitTest :feature:chat:testDebugUnitTest :app:testEmbeddedDebugUnitTest :app:assembleEmbeddedDebug --stacktrace
      - name: Сохранить проверочную сборку APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-arm64-debug
          path: android/app/build/outputs/apk/embedded/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Опубликовать APK
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-android-arm64-debug
          path: apk
      - name: Создать предварительный выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find apk -name '*.apk' -type f)
          test "${#files[@]}" -eq 1
          cp "${files[0]}" Jarvisjon-ru-arm64.apk
          tag="android-${GITHUB_SHA:0:12}"
          gh release create "$tag" Jarvisjon-ru-arm64.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Джарвисджон: Responses API и космо-шарик" --notes "Проверочная сборка ARM64. Подключение одним API-ключом OpenAI, русский интерфейс, космо-шарик, подтверждение действий и Стоп. Работа на физическом телефоне требует проверки."
