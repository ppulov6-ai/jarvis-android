name: Сборка Джарвиса Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Проверка и APK ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Подготовить Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Подготовить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить установленный Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - name: Подготовить Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Проверить Go и собрать встроенный модуль
        run: |
          gofmt -w pkg
          make generate
          go test -count=2 ./...
          make build-android-arm64
      - name: Проверить Android и собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean :core:domain:testDebugUnitTest :backend:api:testDebugUnitTest :backend:config:testDebugUnitTest :core:data:testDebugUnitTest :feature:chat:testDebugUnitTest :app:testEmbeddedDebugUnitTest :app:assembleEmbeddedDebug --no-build-cache --rerun-tasks --stacktrace
      - name: Повторить Android проверки и APK из чистого состояния
        working-directory: android
        run: |
          ./gradlew clean :core:domain:testDebugUnitTest :backend:api:testDebugUnitTest :backend:config:testDebugUnitTest :core:data:testDebugUnitTest :feature:chat:testDebugUnitTest :app:testEmbeddedDebugUnitTest :app:assembleEmbeddedDebug --no-build-cache --rerun-tasks --stacktrace
      - name: Вывести ошибки тестов
        if: always()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in Path('android').glob('**/build/test-results/**/*.xml'):
              for case in ET.parse(report).getroot().iter('testcase'):
                  for failure in case.findall('failure') + case.findall('error'):
                      print(case.get('classname'), case.get('name'), failure.get('message'))
                      print((failure.text or '')[:7000])
          PYCODE
      - name: Сохранить проверочную сборку APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-arm64-debug
          path: android/app/build/outputs/apk/embedded/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Опубликовать APK
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-android-arm64-debug
          path: apk
      - name: Создать предварительный выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find apk -name '*.apk' -type f)
          test "${#files[@]}" -eq 1
          cp "${files[0]}" Jarvisjon-ru-arm64.apk
          tag="android-${GITHUB_SHA:0:12}"
          gh release create "$tag" Jarvisjon-ru-arm64.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Джарвисджон 0.4.4: точный выбор элементов" --notes "Действия по node_id свежего дерева экрана, защита от устаревших координат, прямой ввод в выбранное поле и проверка содержимого. Отказ и таймаут жеста завершаются ошибкой. Ответы Android по умолчанию на русском. Сохранённое разрешение учитывается. Go и Android проверяются дважды из чистого состояния. Сценарии телефонной книги Samsung и MAX на физическом телефоне требуют пользовательской проверки. Подпись отладочная; обновление поверх старой версии с другой подписью Android отклонит."
